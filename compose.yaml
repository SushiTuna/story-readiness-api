# API + Story Board. Run from this directory:  podman compose up --build  (docker compose works too)
# The board is at http://localhost:8080. Data (SQLite + evidence files) lives in ./data.
services:
  api:
    build: .
    container_name: story-api
    env_file: .env
    environment:
      STORIES_DB_PATH: /data/stories.db
    volumes:
      - ./data:/data
    # Here, not in the Dockerfile: Podman builds OCI images, which drop HEALTHCHECK
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    # Uncomment for the API docs (http://localhost:8000/docs) or the Linear webhook:
    # ports:
    #   - "8000:8000"
    restart: unless-stopped

  web:
    build: ../story-board
    container_name: story-board
    ports:
      - "${BOARD_PORT:-8080}:80"  # BOARD_PORT=8081 podman compose up, if 8080 is taken
    depends_on:
      - api
    restart: unless-stopped
