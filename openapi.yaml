          anyOf:
          - type: string
          - type: 'null'
          title: Note
          description: The agent's reason for the change, or null for UI changes.
        story_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Story Key
          description: Human-readable story key, kept after the story is deleted.
        created_at:
          type: string
          format: date-time
          title: Created At
