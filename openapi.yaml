openapi: 3.1.0
info:
  title: Story Readiness API
  summary: Check whether a user story has enough information to start implementation.
  description: 'Each story is judged by TypeSafe''s Jev model in one request. Code then applies blocking
    rules, weights, and thresholds to reach a verdict. Checks depend on the story type: a persona is required
    for user features only, a statement of value is not required for bugs, and technical stories are judged
    on safe rollout instead of application edge cases.


    Weights and thresholds are unvalidated starting points; see the README.'
  version: 0.1.0
paths:
  /api/assess:
    post:
      tags:
      - assess
      summary: Assess a pasted story
      operationId: assessStory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportOut'
        '413':
          description: The story is longer than the size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '502':
          description: The TypeSafe request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/sources:
    get:
      tags:
      - sources
      summary: List issue trackers
      operationId: listSources
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SourceOut'
                type: array
                title: Response Listsources
  /api/sources/{name}/assess:
    post:
      tags:
      - assess
      - sources
      summary: Import a story from a tracker and assess it
      description: Linear is implemented. Jira is still a stub and returns 501.
      operationId: assessFromSource
      parameters:
      - name: name
        in: path
        required: true
        schema:
          enum:
          - jira
          - linear
          type: string
          title: Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: Successful Response
          headers:
            X-Linear-Comment:
              description: Present only when `post_comment` is true. `posted` if the comment was written successfully, `failed` if the comment request failed (the assessment is still returned).
              schema:
                type: string
                enum:
                - posted
                - failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportOut'
        '404':
          description: The issue was not found in the source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: The source is disabled, or its credentials are missing or were rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The story is longer than the size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '501':
          description: Fetching from this source is not implemented yet (Jira).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '502':
          description: The upstream service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/sources/linear/teams:
    get:
      tags:
      - sources
      summary: List the Linear teams the token can see
      operationId: listLinearTeams
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LinearTeamOut'
                type: array
                title: Response Listlinearteams
        '409':
          description: The source is disabled, or its credentials are missing or were rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '502':
          description: The upstream service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /api/sources/linear/issues:
    get:
      tags:
      - sources
      summary: List a Linear team's open issues
      description: Read-only. Returns up to 100 issues that are not completed or canceled, most recently
        updated first.
      operationId: listLinearIssues
      parameters:
      - name: team
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          description: Linear team id, from /sources/linear/teams.
          title: Team
        description: Linear team id, from /sources/linear/teams.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueCardOut'
                title: Response Listlinearissues
        '404':
          description: The team was not found in the source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: The source is disabled, or its credentials are missing or were rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '502':
          description: The upstream service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/boards:
    get:
      tags:
      - boards
      summary: List boards with their story counts
      operationId: listBoards
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BoardOut'
                type: array
                title: Response Listboards
    post:
      tags:
      - boards
      summary: Create an empty board
      operationId: createBoard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardOut'
        '409':
          description: Another board already uses this key prefix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/boards/{board_id}:
    put:
      tags:
      - boards
      summary: Rename a board or change its description
      description: The key prefix cannot change, so story keys stay stable.
      operationId: updateBoard
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          title: Board Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardUpdateIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardOut'
        '404':
          description: The board was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - boards
      summary: Delete a board with all its stories and their assessment history
      operationId: deleteBoard
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          title: Board Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: The board was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/boards/{board_id}/activity:
    get:
      tags:
      - stories
      summary: List activity on a board, newest first
      operationId: listBoardActivity
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          title: Board Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
          title: Limit
          description: Maximum number of entries to return.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ActivityOut'
                type: array
                title: Response Listboardactivity
        '404':
          description: The board was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/boards/{board_id}/stories:
    get:
      tags:
      - stories
      summary: List a board's stored stories with their latest assessment
      operationId: listStories
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          title: Board Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StoredStoryOut'
                type: array
                title: Response Liststories
        '404':
          description: The board was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - stories
      summary: Store a pasted story on a board
      description: Adds the story to the end of the board's backlog. A board holds at most 100 stories, counting
        every column. With parent_id it is split from another story on the board; a child of a human-only story
        is human-only too. A parent_id not on the board is a 422 with loc ["body", "parent_id"] and type parent_invalid.
      operationId: createStory
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          title: Board Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryCreateIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredStoryOut'
        '404':
          description: The board was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: The board already holds the most stories it can.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The story is longer than the size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/stories/{story_id}:
    get:
      tags:
      - stories
      summary: Get a stored story with its latest report and assessment history
      operationId: getStory
      parameters:
      - name: story_id
        in: path
        required: true
        schema:
          type: string
          title: Story Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredStoryDetailOut'
        '404':
          description: The story was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - stories
      summary: Replace a stored story's text and tags
      description: Earlier assessments are kept. Changing the text marks the story stale until it is assessed
        again; changing only the tags does not. Leave tags out to keep the current ones.
      operationId: updateStory
      parameters:
      - name: story_id
        in: path
        required: true
        schema:
          type: string
          title: Story Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredStoryOut'
        '404':
          description: The story was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The story is longer than the size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - stories
      summary: Delete a stored story and its assessment history
      operationId: deleteStory
      parameters:
      - name: story_id
        in: path
        required: true
        schema:
          type: string
          title: Story Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: The story was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/stories/{story_id}/evidence:
    post:
      tags:
      - stories
      summary: Upload an evidence file for a move to Done
      description: A test report (.html, .xml, .json, .txt, .log, .pdf) or a screenshot or recording (.png, .jpg, .jpeg, .gif, .webp, .mp4, .webm, .mov), at most 50 MB. Pass the returned id in done_evidence when moving the story to Done. The content type comes from the file's extension.
      operationId: uploadEvidence
      parameters:
      - name: story_id
        in: path
        required: true
        schema:
          type: string
          title: Story Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_uploadEvidence'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceFileOut'
        '404':
          description: The story was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The evidence file is larger than the size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '415':
          description: The evidence file's type is not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/evidence/{file_id}:
    get:
      tags:
      - stories
      summary: Download an evidence file
      description: Screenshots and recordings are served inline; every other type is served as an attachment. Every response has X-Content-Type-Options nosniff and Content-Security-Policy sandbox.
      operationId: getEvidence
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      responses:
        '200':
          description: The file.
          content:
            application/octet-stream: {}
        '404':
          description: The evidence file was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - stories
      summary: Delete an evidence file that no move has used yet
      operationId: deleteEvidence
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: The evidence file was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: The evidence file is part of a move to Done, so it is kept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/stories/{story_id}/human-only:
    put:
      tags:
      - stories
      summary: Set or clear a stored story's human-only tag
      description: A human-only story depends on a person (accounts, servers, another team's API, or secrets).
        AI agents using the MCP server can read it but not change it, and assessments skip the AI-agent readiness
        checks. Only this API sets or clears the tag. Stories already split from it keep theirs. The latest
        assessment turns stale. The change is logged as story_human_only; setting the value it already has is not.
      operationId: setStoryHumanOnly
      parameters:
      - name: story_id
        in: path
        required: true
        schema:
          type: string
          title: Story Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanOnlyIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredStoryOut'
        '404':
          description: The story was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/stories/{story_id}/blockers:
    post:
      tags:
      - stories
      summary: Make a stored story wait on another story on its board
      description: The story can't enter in_sprint or done until the story it waits on is done; it can still move
        anywhere else. Both stories must be on the same board, and a story can't wait on itself, directly or through
        other stories. A story not on the board is a 422 with loc ["body", "blocker_id"] and type blocker_invalid;
        a cycle is a 422 with type dependency_cycle. Adding a dependency that exists already changes nothing. Does
        not mark the story stale. The change is logged as story_blocker_added.
      operationId: addStoryBlocker
      parameters:
      - name: story_id
        in: path
        required: true
        schema:
          type: string
          title: Story Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockerIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredStoryOut'
        '404':
          description: The story was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/stories/{story_id}/blockers/{blocker_id}:
    delete:
      tags:
      - stories
      summary: Stop a stored story waiting on another story
      description: Removing a dependency that does not exist changes nothing. The change is logged as
        story_blocker_removed.
      operationId: removeStoryBlocker
      parameters:
      - name: story_id
        in: path
        required: true
        schema:
          type: string
          title: Story Id
      - name: blocker_id
        in: path
        required: true
        schema:
          type: string
          title: Blocker Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredStoryOut'
        '404':
          description: The story was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/stories/{story_id}/move:
    put:
      tags:
      - stories
      summary: Move a stored story to a workflow column and position
      description: Used by drag and drop on the board. Does not change the story's text or mark it stale. Moving to the blocked column requires a blocked_reason; moving anywhere else clears it. Entering the done column requires done_evidence (test reports, UI evidence for UI changes, commits); it is recorded in the story's activity. Missing or unusable evidence is a 422 with loc ["body", "done_evidence"]. While the latest assessment's verdict is discuss or needs_refinement (even if stale), the story can only move to backlog or refinement, or within its current column, until it is assessed again; any other column is a 422 with loc ["body", "status"] and type status_not_allowed. A story can't enter in_sprint or done while a story it waits on (blocked_by) is not done; that is a 422 with loc ["body", "status"] and type blockers_open.
      operationId: moveStory
      parameters:
      - name: story_id
        in: path
        required: true
        schema:
          type: string
          title: Story Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryMoveIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredStoryOut'
        '404':
          description: The story was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/stories/{story_id}/assess:
    post:
      tags:
      - stories
      summary: Assess a stored story and save the report to its history
      operationId: assessStoredStory
      parameters:
      - name: story_id
        in: path
        required: true
        schema:
          type: string
          title: Story Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportOut'
        '404':
          description: The story was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The story is longer than the size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '502':
          description: The TypeSafe request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/webhooks/linear:
    post:
      tags:
      - webhooks
      summary: Receive a Linear Issue webhook
      operationId: linearWebhook
      description: Verifies the HMAC-SHA256 signature and the replay window, then schedules
        processing of the issue. Returns 200 immediately so Linear does not retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Linear Issue webhook payload.
      responses:
        '200':
          description: Accepted (processing happens asynchronously).
          content:
            application/json:
              schema: {}
        '400':
          description: The signed payload is not a valid webhook body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Invalid or missing signature, or stale webhook timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: The Linear integration is disabled, or LINEAR_WEBHOOK_SECRET is not configured on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
components:
  schemas:
    ActivityOut:
      properties:
        actor_kind:
          type: string
          enum:
          - agent
          - user
          title: Actor Kind
          description: '`agent` for the MCP server, `user` for the HTTP API.'
        actor:
          type: string
          title: Actor
          description: Agent name, or 'board' for the web UI.
        action:
          type: string
          enum:
          - board_created
          - board_updated
          - story_created
          - story_edited
          - story_moved
          - story_assessed
          - story_deleted
          - story_human_only
          - story_blocker_added
          - story_blocker_removed
          title: Action
        detail:
          type: object
          additionalProperties: true
          title: Detail
          description: Action-specific data, e.g. {"fields":["title"]} or {"from":"backlog","to":"blocked"}. A move into done has an "evidence" object with test_reports, ui_change, ui_evidence and commits; each uploaded file's id, filename, content_type and size are under "file". A split story's story_created has "parent_key"; a story created with tags has "tags"; story_edited's "fields" can include "tags". story_human_only has {"human_only":true|false}, and "inherited_from" (the parent's key) when a split story inherited the tag. story_blocker_added and story_blocker_removed have "blocker_key", the key of the story it waits on.
