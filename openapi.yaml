      title: StoryIn
      description: A story to store. Same fields and limits as AssessRequest, plus tags.
    StoryMoveIn:
      properties:
        status:
          type: string
          enum:
          - backlog
          - refinement
          - ready_for_sprint
          - in_sprint
          - done
          - blocked
          title: Status
          description: Workflow column on the board.
        position:
          type: number
          title: Position
          description: Order within the column, ascending. The client picks a value between the neighbours.
        blocked_reason:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Blocked Reason
          description: Why the story is blocked. Required when status is blocked; not allowed otherwise.
        done_evidence:
          anyOf:
          - $ref: '#/components/schemas/DoneEvidenceIn'
          - type: 'null'
          description: Evidence that the story is done. Required when the story enters the done column; not allowed for other columns.
      type: object
      required:
      - status
      - position
      title: StoryMoveIn
    StoryOut:
      properties:
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        acceptance_criteria:
          type: string
          title: Acceptance Criteria
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
          description: Issue key when imported from a tracker.
        source:
          type: string
          enum:
          - paste
          - jira
          - linear
          title: Source
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
          description: Link to the issue when imported from a tracker.
      type: object
      required:
      - title
      - description
      - acceptance_criteria
      - key
      - source
      - url
      title: StoryOut
      description: The story as judged, after acceptance criteria were split out of the description.
    StoryRefOut:
      properties:
        id:
          type: string
          title: Id
        key:
          type: string
          title: Key
          description: Human-readable key, e.g. FLW-3.
        title:
          type: string
          title: Title
        status:
          type: string
          enum:
          - backlog
          - refinement
          - ready_for_sprint
          - in_sprint
          - done
          - blocked
          title: Status
          description: Its workflow column; done lifts the dependency.
      type: object
      required:
      - id
      - key
      - title
      - status
      title: StoryRefOut
      description: Another story on the same board, in a dependency.
    StoryType:
      properties:
        choice:
          type: string
          enum:
          - user_feature
          - technical
          - bug
          title: Choice
          description: The most likely story type.
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        probabilities:
          additionalProperties:
            type: number
          type: object
          title: Probabilities
          description: Probability of each story type.
      type: object
      required:
      - choice
      - confidence
      - probabilities
      title: StoryType
    TestReportIn:
      properties:
        file_id:
          anyOf:
          - type: string
          - type: 'null'
          title: File Id
          description: ID of an evidence file uploaded for this story and not used yet.
        url:
          anyOf:
          - type: string
            maxLength: 2000
            pattern: ^https?://\S+$
          - type: 'null'
          title: Url
          description: Link to evidence kept elsewhere, e.g. a CI run.
        caption:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Caption
          description: Optional short summary, e.g. '42 passed'.
        kind:
          type: string
          enum:
          - unit
          - integration
          - cucumber
          title: Kind
          description: Which tests the report covers.
      type: object
      required:
      - kind
      title: TestReportIn
      description: A test report. Give exactly one of file_id or url.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
tags:
- name: assess
  description: Judge a story's readiness.
- name: sources
  description: Issue trackers that stories can be imported from.
- name: boards
  description: Boards that each hold up to 100 stories for one goal.
- name: stories
  description: Pasted stories stored in SQLite, with their assessment history.
- name: webhooks
  description: Inbound event hooks from issue trackers.
